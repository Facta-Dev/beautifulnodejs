name: Propose a rule
description: Suggest a rule the skills should add, change, or drop
labels: ["rule"]
body:
  - type: dropdown
    id: skill
    attributes:
      label: Which skill?
      options:
        - nodejs-best-practices (writing code)
        - nodejs-review (reviewing code)
        - nodejs-port (porting to TypeScript)
        - lints config
    validations:
      required: true
  - type: textarea
    id: rule
    attributes:
      label: The rule
      description: One or two sentences, phrased as guidance an agent could follow.
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Source
      description: A link to the published guidance this comes from (the Google TypeScript Style Guide, Effective TypeScript, Node.js Best Practices, TypeScript Deep Dive, the typescript-eslint rule docs, the facta backend-node handbook, and so on).
    validations:
      required: true
  - type: textarea
    id: before
    attributes:
      label: What the agent writes today
      render: typescript
  - type: textarea
    id: after
    attributes:
      label: What it should write instead
      render: typescript